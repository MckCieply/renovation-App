<div class="page-container mat-app-background">

  <header class="page-header">
    <div class="title-group">
      <h1>Work Types</h1>
      <p class="page-subtitle">Configuration</p>
    </div>

    <button mat-raised-button class="btn-large-accent" (click)="createForm()">
      <mat-icon>add</mat-icon>
      <span>Add Work Type</span>
    </button>
  </header>

  <div class="content-surface mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let element" class="bold-cell"> {{ element.name }}</td>
      </ng-container>

      <ng-container matColumnDef="updatedAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Update </th>
        <td mat-cell *matCellDef="let element"
            [matTooltip]="(element.updatedAt | date: 'dd.MM.yyyy h:mm a') ?? ''"
            matTooltipPosition='left'
            matTooltipShowDelay="500">
          {{ element.updatedAt | relativeTime }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="table-actions">
            <button mat-icon-button color="accent" (click)="editForm(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="removeForm(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: tableColumns;"></tr>
    </table>

    <mat-paginator
      [pageSize]="DEFAULT_PAGE_SIZE"
      [pageSizeOptions]="DEFAULT_PAGE_SIZE_OPTIONS"
      showFirstLastButtons>
    </mat-paginator>
  </div>

</div>
