<div class="page-container mat-app-background">

  <header class="page-header">
    <div class="title-group">
      <h1>User Management</h1>
      <p class="page-subtitle">Admin Panel</p>
    </div>
  </header>

  <section class="content-surface mat-elevation-z1">
    <table mat-table [dataSource]="users">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef> Username</th>
        <td mat-cell *matCellDef="let element"> {{ element.username }}</td>
      </ng-container>

      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef> First Name</th>
        <td mat-cell *matCellDef="let element"> {{ element.firstName }}</td>
      </ng-container>

      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef> Last Name</th>
        <td mat-cell *matCellDef="let element"> {{ element.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Roles</th>
        <td mat-cell *matCellDef="let element"> {{ getRolesAsString(element) }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-raised-button style="width:150px"
                  [color]="hasAdminRole(element) ? 'warn' : 'primary'"
                  (click)="toggleAdminRole(element)">
            <span>{{ hasAdminRole(element) ? 'Remove Admin' : 'Add Admin' }}</span>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: tableColumns;"></tr>
    </table>
  </section>
</div>
