spring.config.import=optional:file:./local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/renovationApp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# Trust X-Forwarded-* from the reverse proxy (Caddy), so requests from the
# app's own https origin are not rejected as cross-origin
server.forward-headers-strategy=native

app.jwt.secret=${APP_JWT_SECRET}
app.admin.password=${APP_ADMIN_PASSWORD}
