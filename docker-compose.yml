# Lightweight stack meant to share a server with other apps: it only publishes
# HTTP_PORT (default 8090, never 80/443) and every container has a memory and
# CPU cap.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c max_connections=20
    environment:
      POSTGRES_DB: renovationApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renovationApp"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    cpus: 0.5

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/renovationApp
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?set APP_ADMIN_PASSWORD in .env}
      SHOW_SQL: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
      SERVER_TOMCAT_THREADS_MAX: "20"
      JAVA_TOOL_OPTIONS: >-
        -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 448m
    cpus: 1.0

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      - app
    mem_limit: 64m
    cpus: 0.25

volumes:
  db_data:
